# Copy to arena.toml (not committed). Paths are relative to data_dir unless absolute.
data_dir = "~/tokenz-arena-data"

[submit]
max_zip_mb = 10

[play]
workers = 6                 # parallel games; set from the measured cost of a 500-round game
reference_bot = "reference" # rated 1000; a bot submitted at setup
draft_top_n = 3

[maps]
official = "<repo>/maps/official"   # <repo> = this checkout
rotating = "maps/rotating"
holdout = "maps/holdout"            # data_dir only; never committed, never served

[seeds]
official = [1592614637, 1, 2]
rotating = [1592614637]
holdout = [1592614637]

[retention]
draft_days = 3
replay_days = 14
replay_cap_gb = 40

[api]
host = "100.0.0.0"          # the tailnet address
port = 8700

[server]
url = "https://game.battlecode.au"
key_file = "~/.config/tokenz-arena/unswbc-key"   # one member's key, mode 600, outside data_dir
                            # (a bare key, or the toolkit's ~/.unswbc/keys.json, which is also
                            # the fallback when this file is missing)
auto_submit = true
min_hours = 4               # between uploads
head_to_head_min = 0.55     # candidate vs live bot...
head_to_head_games = 60     # ...over at least this many games
cpu_p99_max = 70_000_000    # points per turn (cap is 100M)
poll_seconds = 60           # how often new battles are downloaded
download_limit = 20         # how many recent battles each poll looks at
download_per_poll = 3       # new battles imported per poll (5 games each, ~11 requests)
gate_seconds = 300          # how often the champion gate is evaluated
