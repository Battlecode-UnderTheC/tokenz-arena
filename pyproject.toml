[project]
name = "tokenz-arena"
version = "0.1.0"
description = "Team arena for unswbc dragons bots: official-judge games, ratings, reports, replays over HTTP and MCP"
requires-python = ">=3.12"
dependencies = [
    "unswbc==1.2.9",          # the judge; keep at the competition server's version
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Website-only competition data (quota, per-map detail, brackets). A private repo in the org,
# so CI runs without it; poscatgpu2 installs it with `uv sync --extra server`.
server = ["bcweb @ git+ssh://git@github.com/Battlecode-UnderTheC/bcweb.git"]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["arena"]
