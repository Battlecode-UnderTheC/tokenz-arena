[project]
name = "tokenz-arena"
version = "0.1.0"
description = "Team arena for unswbc dragons bots: official-judge games, ratings, reports, replays over HTTP and MCP"
requires-python = ">=3.12"
dependencies = [
    "unswbc==1.2.3",          # the judge; keep at the competition server's version
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.2",
    "bcweb @ git+ssh://git@github.com/Battlecode-UnderTheC/bcweb.git",   # website-only data (quota, brackets)
]

[project.scripts]
arena = "arena.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["arena"]
