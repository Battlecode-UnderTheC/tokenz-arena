# poscatgpu2: the arena behind a Tailscale sidecar.
#   cp deploy/env.example .env   (TS_AUTHKEY, paths)   then: docker compose up -d --build
# The arena shares the sidecar's network namespace and listens on 127.0.0.1:8700 only, so the
# one way in is `tailscale serve` (HTTPS on the tailnet), which adds Tailscale-User-Login.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-tokenz-arena}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/serve.json:/config/serve.json:ro
    restart: unless-stopped

  arena:
    image: tokenz-arena:latest
    build:
      context: .
      additional_contexts:
        bcweb: ${BCWEB_DIR:-../bcweb}
    user: "${ARENA_UID:-1000}:${ARENA_GID:-1000}"   # files in ARENA_DATA stay the host user's
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - ${ARENA_DATA:-~/tokenz-arena-data}:/data
      - ${ARENA_CACHE:-~/.cache/tokenz-arena-unswbc}:/home/arena/.cache/unswbc
      - ${ARENA_SECRETS:-~/.config/tokenz-arena}:/secrets:ro
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  ts-state:
