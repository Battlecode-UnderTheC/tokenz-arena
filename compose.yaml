# poscatgpu2: the arena behind a Tailscale sidecar.
#   cp deploy/env.example .env   (TS_AUTHKEY, paths)   then: docker compose up -d --build
# The engine and the website share the sidecar's network namespace and listen on 127.0.0.1
# only, so the one way in is `tailscale serve` (HTTPS on the tailnet) to the website.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-tokenz-arena}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./deploy/serve.json:/config/serve.json:ro
    restart: unless-stopped

  # The engine: the only writer (scheduler, judge worker processes, server bridge), with an
  # internal API on 127.0.0.1:8701 that the website forwards writes to.
  engine: &arena
    image: tokenz-arena:latest
    build:
      context: .
      additional_contexts:
        bcweb: ${BCWEB_DIR:-../bcweb}
    command: ["arena", "run", "--config", "/data/arena.toml"]
    user: "${ARENA_UID:-1000}:${ARENA_GID:-1000}"   # files in ARENA_DATA stay the host user's
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - ${ARENA_DATA:-~/tokenz-arena-data}:/data
      - ${ARENA_CACHE:-~/.cache/tokenz-arena-unswbc}:/home/arena/.cache/unswbc
      - ${ARENA_SECRETS:-~/.config/tokenz-arena}:/secrets:ro
    restart: unless-stopped
    stop_grace_period: 30s

  # The website, API and MCP on 127.0.0.1:8700 (behind tailscale serve): a read-only copy of
  # the state, refreshed every second. It runs no games, so pages stay fast.
  web:
    <<: *arena
    command: ["arena", "web", "--config", "/data/arena.toml", "--port", "8700"]
    depends_on: [tailscale, engine]
    stop_grace_period: 5s

  # Evals: downloads finished battles between other teams from the competition server and
  # checks our metrics against them (data/evals/). Its own process; the website only reads.
  # Scaler: rents vast.ai workers while the queue is long (docs/SCALER.md). Own process; it
  # reads the engine's queue on 127.0.0.1:8701 and writes data/scaler/ and worker-tokens.json.
  scaler:
    <<: *arena
    command: ["arena", "scaler", "--config", "/data/arena.toml"]
    depends_on: [tailscale, engine]
    stop_grace_period: 5s

  evals:
    <<: *arena
    command: ["arena", "evals", "--config", "/data/arena.toml"]
    depends_on: [tailscale]
    stop_grace_period: 5s

volumes:
  ts-state:
